<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pomodoro Timer</title>
<style>
  :root {
    --black: #111111;
    --white: #ffffff;
    --border: #111111;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--white);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .wrap {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(12px, 4%, 40px);
  }

  .card {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(20px, 6%, 48px);
  }

  /* Mode tabs */
  .tabs {
    display: flex;
    gap: clamp(8px, 1.5vw, 14px);
    flex-wrap: wrap;
    justify-content: center;
  }

  .tab {
    appearance: none;
    border: 2px solid var(--border);
    background: var(--white);
    color: var(--black);
    font-weight: 700;
    font-size: clamp(13px, 2.4vw, 20px);
    padding: clamp(8px, 1.6vw, 14px) clamp(16px, 3vw, 28px);
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background .15s ease, color .15s ease;
    font-family: inherit;
  }

  .tab.active {
    background: var(--black);
    color: var(--white);
  }

  .tab:hover:not(.active) {
    background: #f2f2f2;
  }

  /* Timer display */
  .timer {
    font-size: clamp(56px, 15vw, 140px);
    font-weight: 800;
    color: var(--black);
    line-height: 1;
    letter-spacing: -0.02em;
    user-select: none;
    font-variant-numeric: tabular-nums;
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: clamp(14px, 3vw, 24px);
  }

  .start-btn {
    appearance: none;
    border: none;
    background: var(--black);
    color: var(--white);
    font-weight: 700;
    font-size: clamp(16px, 3vw, 26px);
    padding: clamp(10px, 2vw, 18px) clamp(32px, 7vw, 56px);
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    min-width: clamp(120px, 20vw, 190px);
    transition: opacity .15s ease;
  }

  .start-btn:hover {
    opacity: 0.85;
  }

  .icon-btn {
    appearance: none;
    border: none;
    background: transparent;
    color: var(--black);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px;
  }

  .icon-btn svg {
    width: clamp(22px, 4vw, 34px);
    height: clamp(22px, 4vw, 34px);
  }

  .icon-btn:hover {
    opacity: 0.6;
  }

  /* Make it comfortable at very small sizes (Notion mobile / narrow embeds) */
  @media (max-width: 340px) {
    .tabs { gap: 6px; }
    .tab { padding: 7px 12px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="card">
    <div class="tabs">
      <button class="tab active" data-mode="pomodoro" data-minutes="25">Pomodoro</button>
      <button class="tab" data-mode="short" data-minutes="5">Short Break</button>
      <button class="tab" data-mode="long" data-minutes="15">Long Break</button>
    </div>

    <div class="timer" id="timerDisplay">25:00</div>

    <div class="controls">
      <button class="start-btn" id="startBtn">Start</button>
      <button class="icon-btn" id="resetBtn" title="Reset" aria-label="Reset">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 3-6.7"></path>
          <path d="M3 4v5h5"></path>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
  const tabs = document.querySelectorAll('.tab');
  const timerDisplay = document.getElementById('timerDisplay');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');

  let currentMinutes = 25;
  let totalSeconds = currentMinutes * 60;
  let remaining = totalSeconds;
  let intervalId = null;
  let running = false;

  function formatTime(secs) {
    const m = Math.floor(secs / 60).toString().padStart(2, '0');
    const s = Math.floor(secs % 60).toString().padStart(2, '0');
    return m + ':' + s;
  }

  function updateDisplay() {
    timerDisplay.textContent = formatTime(remaining);
  }

  function setMode(tab) {
    stopTimer();
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentMinutes = parseInt(tab.dataset.minutes, 10);
    totalSeconds = currentMinutes * 60;
    remaining = totalSeconds;
    updateDisplay();
    startBtn.textContent = 'Start';
  }

  function tick() {
    if (remaining > 0) {
      remaining--;
      updateDisplay();
    }
    if (remaining <= 0) {
      stopTimer();
      startBtn.textContent = 'Start';
    }
  }

  function startTimer() {
    running = true;
    startBtn.textContent = 'Pause';
    intervalId = setInterval(tick, 1000);
  }

  function stopTimer() {
    running = false;
    clearInterval(intervalId);
    intervalId = null;
  }

  tabs.forEach(tab => {
    tab.addEventListener('click', () => setMode(tab));
  });

  startBtn.addEventListener('click', () => {
    if (running) {
      stopTimer();
      startBtn.textContent = 'Start';
    } else {
      if (remaining <= 0) remaining = totalSeconds;
      startTimer();
    }
  });

  resetBtn.addEventListener('click', () => {
    stopTimer();
    remaining = totalSeconds;
    updateDisplay();
    startBtn.textContent = 'Start';
  });

  updateDisplay();
</script>

</body>
</html>
